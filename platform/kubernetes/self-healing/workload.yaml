apiVersion: v1
kind: Namespace
metadata:
  name: self-healing
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: self-healing
  namespace: self-healing
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: self-healing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: self-healing
    spec:
      containers:
        - name: agnhost
          image: registry.k8s.io/e2e-test-images/agnhost:2.66.1
          args:
            - serve-hostname
            - --http
            - --port
            - "8080"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: self-healing
  namespace: self-healing
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: self-healing
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
