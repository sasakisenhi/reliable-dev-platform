schema_version: "1.0"

preset:
  id: "reliable-dev"
  name: "Reliable Development"
  version: "0.1.0"
  description: "Traceability, scope discipline, failure verification, evidence, and upstream-correction rules for Spec Kit."
  author: "local"

requires:
  speckit_version: ">=0.6.0"

provides:
  templates:
    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "Add reliable specification rules"
      strategy: "append"

    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Add traceable and repository-grounded planning rules"
      strategy: "append"

    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Add atomic and verification-oriented task generation rules"
      strategy: "append"

    - type: "command"
      name: "speckit.analyze"
      file: "commands/speckit.analyze.md"
      description: "Add end-to-end traceability and evidence analysis"
      strategy: "append"

    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      description: "Add evidence-based completion and upstream-authority rules"
      strategy: "append"

    - type: "command"
      name: "speckit.converge"
      file: "commands/speckit.converge.md"
      description: "Add convergence and upstream-correction rules"
      strategy: "append"

    - type: "template"
      name: "spec-template"
      file: "templates/spec-addendum.md"
      description: "Add assumptions, failure scope, and evidence semantics"
      strategy: "append"

    - type: "template"
      name: "plan-template"
      file: "templates/plan-addendum.md"
      description: "Add technical decision traceability and environment assumptions"
      strategy: "append"

    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-addendum.md"
      description: "Add task atomicity and verification guidance"
      strategy: "append"

tags:
  - "reliability"
  - "traceability"
  - "verification"
  - "quality"
